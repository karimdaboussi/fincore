spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fincore}
    username: ${DB_USER:fincore}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  error:
    include-message: never
fincore:
  jwt-secret: ${JWT_SECRET}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
